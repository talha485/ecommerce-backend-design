{% extends "base.html" %}
{% block content %}

<div class="grid">
    <form method="get">
    <input type="text" name="q" placeholder="Search products...">
    <button type="submit">Search</button>
</form>

{% for product in products %}
    <div class="card">
        <h3>{{ product.name }}</h3>
        <p>{{ product.price }}</p>

        {% if product.image %}
            <img src="{{ product.image.url }}">
        {% endif %}

        <a href="/products/{{ product.id }}/">View</a>
    </div>
{% endfor %}
</div>
{% endblock %}
